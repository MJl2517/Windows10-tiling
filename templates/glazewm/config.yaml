general:
  startup_commands: ['shell-exec @ZEBAR_F@', 'shell-exec @PROFILE_F@/.glzr/tools/tacky-borders/tacky-borders.exe', 'shell-exec @PROFILE_F@/.glzr/tools/taskbar-toggle/taskbar-toggle.exe']
  shutdown_commands: ['shell-exec @PROFILE_F@/.glzr/tools/taskbar-toggle/taskbar-toggle.exe --stop', 'shell-exec taskkill /IM zebar.exe /F', 'shell-exec taskkill /IM tacky-borders.exe /F']
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: false
    trigger: monitor_focus
  hide_method: cloak
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: 8px
  # 40px bar + 8px gap, scaled with monitor DPI; no AppBar hot-reload drift.
  outer_gap: {top: 48px, right: 8px, bottom: 8px, left: 8px}

window_effects:
  focused_window:
    border: {enabled: false, color: '#94a9c9'}
    transparency: {enabled: false, opacity: '100%'}
  other_windows:
    border: {enabled: false, color: '#454b57'}
    transparency: {enabled: false, opacity: '100%'}

window_behavior:
  initial_state: tiling
  state_defaults:
    floating: {centered: true, shown_on_top: false}
    fullscreen: {maximized: false, shown_on_top: false}

workspaces:
  - {name: '1', display_name: '1 WEB', bind_to_monitor: 0, keep_alive: true}
  - {name: '2', display_name: '2 DEV', bind_to_monitor: 0, keep_alive: true}
  - {name: '3', display_name: '3 FILES', bind_to_monitor: 0, keep_alive: true}
  - {name: '4', display_name: '4 CHAT', bind_to_monitor: 0, keep_alive: true}
  - {name: '5', display_name: '5 TTRPG', bind_to_monitor: 0, keep_alive: true}
  - {name: '6', display_name: '6 MEDIA', bind_to_monitor: 1, keep_alive: true}
  - {name: '7', display_name: '7 VPN', bind_to_monitor: 1, keep_alive: true}
  - {name: '8', display_name: '8 DOUBLE', bind_to_monitor: 1, keep_alive: true}
  - {name: '9', display_name: '9 OTHER', bind_to_monitor: 1, keep_alive: true}
  - {name: '0', display_name: '0 OTHER', bind_to_monitor: 1, keep_alive: true}

window_rules:
  - commands: ['set-floating --centered=true --shown-on-top=true']
    match:
      - window_process: {equals: Center}
        window_title: {regex: '^Rose Pine Desktop'}
  # Native dialogs must retain Windows DPI sizing and their original placement.
  - commands: [ignore]
    match:
      - window_class: {regex: '^(#32770|OperationStatusWindow|MsiDialogCloseClass)$'}

  # Installers and custom dialogs should keep the size chosen by the app.
  - commands: ['set-floating --centered=false']
    on: [manage, title_change]
    match:
      - window_class: {regex: '^(TWizardForm|TSelectLanguageForm|TUninstallProgressForm|MozillaDialogClass)$'}
      - window_title: {regex: '(?i)^(Installation Wizard|Setup Wizard|Мастер установки)(?:\s+[-–—:]\s*.+)?$'}
      - window_class: {regex: '^(Chrome_WidgetWin_[01]|Qt[0-9]*QWindowIcon|WinUIDesktopWin32WindowClass|HwndWrapper\[.+\])$'}
        window_title: {regex: '(?i)^(Open File|Open Folder|Save As|Select Folder|Choose Folder|Confirm(?:ation)?|Открыть файл|Открыть папку|Сохранить как|Выбор папки|Выбрать папку|Подтверждение)$'}

  - commands: [ignore]
    match:
      # Screenshot overlays must keep their native screen coordinates.
      - window_process: {equals: Lightshot}
      - window_process: {equals: tacky-borders}
      - window_process: {equals: zebar}
        window_title: {not_equals: 'Zebar - hypr-dark / help'}
      - window_process: {regex: '^PowerToys\.(CommandPalette|Peek|ColorPicker|CropAndLock|QuickAccess)'}
      - window_process: {equals: Microsoft.CmdPal.UI}
      - window_title: {equals: Command Palette}
        window_class: {equals: WinUIDesktopWin32WindowClass}
      - window_process: {regex: '^wallpaper(32|64)$'}
      # Only actual installed game executables; never match all java/Unity/Unreal windows.
      - window_process: {regex: '^(PlateUp|Supermarket Together|Aurelia|Expedition33_Steam|SandFall-Win64-Shipping|Marvel|Marvel-Win64-Shipping|SlayTheSpire|Fall of Avalon|We Were Here)$'}
      - window_process: {regex: '^javaw?$'}
        window_title: {equals: Slay the Spire}

  - commands: ['set-floating --centered=true --shown-on-top=true']
    match:
      - window_process: {equals: yazi-drag}

  - commands: ['set-floating --centered=true --shown-on-top=true']
    match:
      - window_process: {equals: power-menu}

  # Custom palettes remain managed floating windows.
  - commands: ['set-floating --centered=true --shown-on-top=true']
    match:
      - window_process: {equals: powershell}
        window_title: {equals: 'Yazi — Открыть с помощью'}
      - window_process: {equals: tacky-borders}
      - window_process: {equals: zebar}
        window_title: {equals: 'Zebar - hypr-dark / help'}
  - commands: [set-floating]
    match:
      - window_process: {regex: '^(CalculatorApp|Calculator|calc|SystemSettings)$'}
      - window_process: {equals: explorer}
        window_title: {regex: '^(Applications|Приложения)$'}
      - window_class: {regex: '^(Chrome_WidgetWin_1|MozillaDialogClass)$'}
        window_title: {regex: '(?i)^(picture.in.picture|картинка в картинке|картинка-в-картинке)$'}
      # Keep Steam Library tiled; only named Steam dialogs float.
      - window_process: {regex: '^steam(webhelper)?$'}
        window_title: {regex: '(?i)^(settings|настройки|friends.*|друзья.*|.* - (properties|свойства)|.*(install|установка|confirmation|подтверждение).*)$'}
  - commands: [set-floating]
    on: [title_change]
    run_once: false
    match:
      - window_process: {regex: '^steam(webhelper)?$'}
        window_title: {regex: '(?i)^(settings|настройки|friends.*|друзья.*|.* - (properties|свойства)|.*(install|установка|confirmation|подтверждение).*)$'}

keybindings:
@KEYBINDINGS@
