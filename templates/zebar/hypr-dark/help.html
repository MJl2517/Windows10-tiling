<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GlazeWM — горячие клавиши</title>
<style>
:root{color-scheme:dark;font:14px 'Segoe UI',sans-serif;color:#dbe4f1;background:#171c25}*{box-sizing:border-box}body{margin:0;padding:24px 28px;border:2px solid #a9c4e7;min-height:100vh}header{display:flex;align-items:center;justify-content:space-between}h1{margin:0;font-size:23px;color:#e8f2ff}p{color:#a8b5c9;margin:10px 0 16px}button{font:inherit;color:#e5efff;background:#303e53;border:1px solid #7693b8;border-radius:5px;padding:6px 16px;cursor:pointer}button:focus-visible{outline:2px solid #b6d7ff}table{border-collapse:collapse;width:100%;font-size:14px}td{padding:7px 8px;border-bottom:1px solid #2a3444}td:first-child{font-family:Consolas,monospace;color:#bcd6f6;white-space:nowrap;width:45%}footer{margin-top:17px;font-size:13px;color:#9eafc7;line-height:1.6}
</style>
</head>
<body>
<header><h1>Горячие клавиши GlazeWM</h1><button id="close" autofocus>Закрыть · Esc</button></header>
<p>Текущие сочетания окружения. Несколько сочетаний в строке — альтернативные клавиши.</p>
<table>
@SHORTCUT_ROWS@
</table>
<footer>Сочетания работают на одинаковых физических клавишах EN/RU.<br>Изменить их можно в центре управления → «Горячие клавиши».<br>Esc и кнопка «Закрыть» закрывают подсказку.</footer>
<script type="module">
import { currentWidget } from './zebar.bundle.mjs';
const close = () => currentWidget().window.tauri.close().catch(console.error);
document.getElementById('close').onclick = close;
document.addEventListener('keydown', event => { if(event.key === 'Escape') close(); });
</script>
</body></html>
